<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History FT Free Fire - RASYHZ TEAM</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
    <div id="toast" class="toast">Data berhasil diperbarui!</div>

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
        <h1 class="logo">RASYHZ FF TEAM</h1>
        <nav>
            <a href="index.html">← Kembali ke Portfolio</a>
            <button id="auth-btn" class="admin-login-btn">Login Admin</button>
        </nav>
    </header>

    <main>
        <section class="gallery-section">
            <h2>History FT & Tournament Match</h2>
            <p class="section-desc">Galeri publik rekap match, turnamen, scrim, dan dokumentasi kemenangan tim Free
                Fire.</p>

            <!-- Kategori / Filter Tag Buttons -->
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">Semua</button>
                <button class="filter-btn" data-filter="Champion">Champion / Booyah</button>
                <button class="filter-btn" data-filter="Tournament">Fast Tournament</button>
                <button class="filter-btn" data-filter="Scrim">Scrim / War</button>
            </div>

            <!-- ================= MODAL LOGIN ADMIN ================= -->
            <div id="login-modal" class="modal hidden">
                <div class="modal-content">
                    <h3>Login Khusus Admin</h3>
                    <input type="email" id="admin-email" placeholder="Email Admin">

                    <div class="password-box">
                        <input type="password" id="admin-password" placeholder="Password Admin">
                        <button type="button" id="toggle-password-btn" class="eye-toggle-btn"
                            title="Lihat/Sembunyikan Sandi">👁️</button>
                    </div>

                    <div class="modal-actions">
                        <button id="do-login-btn" class="custom-file-upload">Masuk</button>
                        <button id="close-login-btn" class="cancel-btn">Batal</button>
                    </div>
                </div>
            </div>

            <!-- ================= PANEL UPLOAD KHUSUS ADMIN ================= -->
            <div id="admin-upload-panel" class="upload-box hidden">
                <div class="admin-badge">Mode Admin Aktif</div>
                <div class="input-group">
                    <input type="text" id="match-title" placeholder="Judul Match (misal: Grand Final Fast Tournament)">
                    <input type="text" id="match-desc" placeholder="Keterangan (misal: Booyah #1 • 14 Kills)">

                    <!-- Kategori Dropdown -->
                    <select id="match-category" class="custom-select">
                        <option value="Champion">🏆 Champion / Booyah</option>
                        <option value="Tournament">⚔️ Fast Tournament</option>
                        <option value="Scrim">🛡️ Scrim / Guild War</option>
                    </select>

                    <label for="match-file-input" class="file-picker-btn">
                        📁 Pilih File Gambar Scoreboard dari Perangkat
                    </label>
                    <input type="file" id="match-file-input" accept="image/*" style="display: none;">
                    <span id="selected-file-name" class="file-status-text">Belum ada file dipilih</span>

                    <button id="save-photo-btn" class="custom-file-upload">
                        + Publikasikan Foto ke Galeri
                    </button>
                </div>
            </div>

            <!-- ================= WADAH GALERI PUBLIK ================= -->
            <div class="grid-container" id="ff-gallery-grid">
                <p id="loading-text">Memuat dokumentasi match...</p>
            </div>
        </section>
    </main>

    <!-- ================= LIGHTBOX MODAL (PREVIEW GAMBAR BESAR) ================= -->
    <div id="lightbox-modal" class="lightbox-modal hidden" onclick="closeLightbox(event)">
        <span class="lightbox-close">&times;</span>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Fullscreen Preview">
            <div class="lightbox-caption">
                <h3 id="lightbox-title"></h3>
                <p id="lightbox-desc"></p>
                <span id="lightbox-tag" class="match-tag"></span>
            </div>
        </div>
    </div>

    <!-- ================= FIREBASE & APP SCRIPT ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCT2JQgsl7APNAqRGz_J5kxlZ73UBJBmts",
            authDomain: "ff-ft-1c86d.firebaseapp.com",
            projectId: "ff-ft-1c86d",
            storageBucket: "ff-ft-1c86d.firebasestorage.app",
            messagingSenderId: "79295926648",
            appId: "1:79295926648:web:10e02eb1efa666a15bb88d",
            measurementId: "G-QL8NDHBEN9"
        };

        const IMGBB_API_KEY = "2f116b49e631b800433c21aadeb95ff4";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isAdmin = false;
        let allMatches = [];
        let currentFilter = 'all';

        const authBtn = document.getElementById('auth-btn');
        const loginModal = document.getElementById('login-modal');
        const closeLoginBtn = document.getElementById('close-login-btn');
        const doLoginBtn = document.getElementById('do-login-btn');
        const adminUploadPanel = document.getElementById('admin-upload-panel');
        const galleryGrid = document.getElementById('ff-gallery-grid');
        const savePhotoBtn = document.getElementById('save-photo-btn');
        const fileInput = document.getElementById('match-file-input');
        const fileNameLabel = document.getElementById('selected-file-name');
        const passwordInput = document.getElementById('admin-password');
        const togglePasswordBtn = document.getElementById('toggle-password-btn');

        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePasswordBtn.innerText = '🙈';
            } else {
                passwordInput.type = 'password';
                togglePasswordBtn.innerText = '👁️';
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileNameLabel.innerText = "File: " + fileInput.files[0].name;
            } else {
                fileNameLabel.innerText = "Belum ada file dipilih";
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                isAdmin = true;
                authBtn.innerText = "Logout (" + user.email.split('@')[0] + ")";
                adminUploadPanel.classList.remove('hidden');
            } else {
                isAdmin = false;
                authBtn.innerText = "Login Admin";
                adminUploadPanel.classList.add('hidden');
            }
            loadPublicGallery();
        });

        authBtn.addEventListener('click', () => {
            if (isAdmin) {
                signOut(auth);
            } else {
                loginModal.classList.remove('hidden');
            }
        });

        closeLoginBtn.addEventListener('click', () => {
            loginModal.classList.add('hidden');
            passwordInput.type = 'password';
            togglePasswordBtn.innerText = '👁️';
        });

        doLoginBtn.addEventListener('click', async () => {
            const email = document.getElementById('admin-email').value;
            const pass = passwordInput.value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                loginModal.classList.add('hidden');
            } catch (err) {
                alert("Login gagal: " + err.message);
            }
        });

        // Filter button click handler
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                renderGallery();
            });
        });

        // Upload match baru
        savePhotoBtn.addEventListener('click', async () => {
            const title = document.getElementById('match-title').value;
            const desc = document.getElementById('match-desc').value;
            const category = document.getElementById('match-category').value;
            const file = fileInput.files[0];

            if (!title || !file) {
                alert("Harap isi judul dan pilih foto match!");
                return;
            }

            savePhotoBtn.innerText = "Mengunggah scoreboard...";
            savePhotoBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append("image", file);

                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                if (!result.success) throw new Error("Gagal mengunggah foto ke ImgBB.");

                const uploadedUrl = result.data.url;

                await addDoc(collection(db, "ff_matches"), {
                    title: title,
                    desc: desc || "Dokumentasi Match",
                    category: category || "Tournament",
                    imageUrl: uploadedUrl,
                    createdAt: new Date().getTime()
                });

                document.getElementById('match-title').value = '';
                document.getElementById('match-desc').value = '';
                fileInput.value = '';
                fileNameLabel.innerText = 'Belum ada file dipilih';

                alert("Match baru berhasil dipublikasikan!");
                loadPublicGallery();
            } catch (e) {
                alert("Error: " + e.message);
            } finally {
                savePhotoBtn.innerText = "+ Publikasikan Foto ke Galeri";
                savePhotoBtn.disabled = false;
            }
        });

        // Ambil data Firestore
        async function loadPublicGallery() {
            try {
                const q = query(collection(db, "ff_matches"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                allMatches = [];
                querySnapshot.forEach(docSnap => {
                    allMatches.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderGallery();
            } catch (error) {
                galleryGrid.innerHTML = '<p class="section-desc">Gagal memuat galeri: ' + error.message + '</p>';
            }
        }

        // Render data sesuai filter
        function renderGallery() {
            galleryGrid.innerHTML = '';
            const filtered = currentFilter === 'all'
                ? allMatches
                : allMatches.filter(m => (m.category || 'Tournament') === currentFilter);

            if (filtered.length === 0) {
                galleryGrid.innerHTML = '<p class="section-desc">Belum ada dokumentasi untuk kategori ini.</p>';
                return;
            }

            filtered.forEach(data => {
                const card = document.createElement('div');
                card.classList.add('card', 'ff-card');

                let deleteBtnHtml = isAdmin
                    ? `<button class="delete-btn" data-doc-id="${data.id}">🗑️ Hapus Foto</button>`
                    : '';

                card.innerHTML = `
                    <div class="card-thumb-wrap" onclick="openLightbox('${data.imageUrl}', '${data.title}', '${data.desc}', '${data.category || 'Match'}')">
                        <img src="${data.imageUrl}" alt="${data.title}" onerror="this.src='https://picsum.photos/400/225'">
                        <span class="match-tag">${data.category || 'Tournament'}</span>
                    </div>
                    <div class="ff-card-info">
                        <h3>${data.title}</h3>
                        <p>${data.desc}</p>
                        ${deleteBtnHtml}
                    </div>
                `;
                galleryGrid.appendChild(card);
            });

            if (isAdmin) {
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-doc-id');
                        if (confirm("Hapus foto riwayat match ini?")) {
                            try {
                                await deleteDoc(doc(db, "ff_matches", id));
                                loadPublicGallery();
                            } catch (err) {
                                alert("Gagal menghapus: " + err.message);
                            }
                        }
                    });
                });
            }
        }

        // Lightbox Functions
        window.openLightbox = (url, title, desc, tag) => {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-title').innerText = title;
            document.getElementById('lightbox-desc').innerText = desc;
            document.getElementById('lightbox-tag').innerText = tag;
            document.getElementById('lightbox-modal').classList.remove('hidden');
        };

        window.closeLightbox = (e) => {
            if (e.target.id === 'lightbox-modal' || e.target.classList.contains('lightbox-close')) {
                document.getElementById('lightbox-modal').classList.add('hidden');
            }
        };

        loadPublicGallery();
    </script>
</body>

</html>
